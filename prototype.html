}.stop{position:relative;padding:0 0 15px;font-size:11px}.stop:before{content:"";position:absolute;width:9px;height:9px;background:var(--green);border:2px solid white;box-shadow:0 0 0 1px #b7dccc;border-radius:50%;left:-22px;top:1px}.stop:last-child{padding-bottom:0}.stop span{display:block;color:var(--muted);margin-top:3px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:700;color:#506579}.field.full{grid-column:1/-1}.textarea{min-height:90px;resize:vertical}.upload{border:1px dashed #b9c9d4;border-radius:10px;padding:22px;text-align:center;color:#718096;font-size:12px;background:#fbfdff}.upload input{max-width:100%;margin-top:12px;font-size:11px}.report-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.success-box{background:#e7f8f0;border:1px solid #c5eedc;border-radius:12px;padding:17px;color:#146846;display:none;margin-top:14px;font-size:12px}.success-box strong{display:block;margin-bottom:5px}.toast{position:fixed;right:25px;bottom:25px;background:#143b53;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px #0002;z-index:20;font-size:12px;display:none}.modal-back{position:fixed;inset:0;background:#0c223a75;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}.modal{background:white;border-radius:17px;padding:24px;width:min(520px,100%);box-shadow:0 20px 60px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{margin:0;font-size:19px}.close{background:#f1f5f8;border-radius:8px;padding:7px 10px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-stat{background:#f7fafc;padding:13px;border-radius:10px}.detail-stat small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.detail-stat strong{font-size:15px}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.mobile-menu{display:none}
@media(max-width:1100px){.sidebar{width:205px}.main{margin-left:205px;width:calc(100% - 205px)}.content{padding:22px 20px}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.grid-even{grid-template-columns:1fr}.route-layout{grid-template-columns:1fr}.report-layout{grid-template-columns:1fr}}

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon">♻</div><div class="brand-text"><strong>SmartBin Alert</strong><small>Smart Waste Monitoring</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">⌂</span><span class="nav-label">Dashboard</span></button>
    <button data-page="map"><span class="ico">⌖</span><span class="nav-label">Live Map</span></button>
    <button data-page="alerts"><span class="ico">♧</span><span class="nav-label">Alerts</span></button>
    <button data-page="analytics"><span class="ico">▥</span><span class="nav-label">Analytics</span></button>
    <button data-page="routes"><span class="ico">⌁</span><span class="nav-label">Route Planning</span></button>
    <button data-page="reports"><span class="ico">▤</span><span class="nav-label">Citizen Reports</span></button>
    <button data-page="settings"><span class="ico">⚙</span><span class="nav-label">Settings</span></button>
  </nav>
  <div class="side-bottom">🌿 Cleaner City<br>Greener Tomorrow</div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb" id="crumb">Municipal Operations / Dashboard</div><div class="top-right"><span class="location">⌖ Bengaluru, Karnataka</span><button class="bell" onclick="go('alerts')" aria-label="Notifications">♧ <b id="bellCount">9</b></button><div class="user"><div class="avatar">SV</div><span>Supervisor ▾</span></div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Bin details</h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const bins=[
{id:"BIN-028",area:"Koramangala (Main Rd)",fill:92,lat:12.9352,lng:77.6245,updated:"12:30 PM",trend:[64,70,75,81,86,92],kind:"General waste"},
{id:"BIN-017",area:"Indiranagar (6th Cross)",fill:88,lat:12.9784,lng:77.6408,updated:"11:45 AM",trend:[55,61,67,74,81,88],kind:"General waste"},
{id:"BIN-034",area:"BTM Layout (4th Stage)",fill:85,lat:12.9166,lng:77.6101,updated:"11:20 AM",trend:[45,52,61,69,77,85],kind:"Mixed waste"},
{id:"BIN-041",area:"Whitefield (Main Rd)",fill:83,lat:12.9698,lng:77.7500,updated:"10:50 AM",trend:[40,48,59,65,75,83],kind:"Recyclables"},
{id:"BIN-012",area:"Rajajinagar (3rd Block)",fill:82,lat:13.0108,lng:77.5550,updated:"10:15 AM",trend:[44,50,58,66,73,82],kind:"General waste"},
{id:"BIN-006",area:"Jayanagar 4th Block",fill:74,lat:12.9250,lng:77.5838,updated:"12:15 PM",trend:[38,44,50,61,69,74],kind:"Organic waste"},
{id:"BIN-023",area:"Marathahalli (Outer Ring Rd)",fill:68,lat:12.9560,lng:77.7010,updated:"12:05 PM",trend:[31,40,49,57,63,68],kind:"Mixed waste"},
{id:"BIN-015",area:"Malleshwaram 8th Cross",fill:57,lat:13.0031,lng:77.5700,updated:"11:55 AM",trend:[25,32,39,46,52,57],kind:"Recyclables"},
{id:"BIN-009",area:"HSR Layout Sector 2",fill:46,lat:12.9116,lng:77.6474,updated:"12:22 PM",trend:[18,24,30,36,41,46],kind:"Organic waste"},
{id:"BIN-031",area:"MG Road",fill:34,lat:12.9758,lng:77.6066,updated:"12:28 PM",trend:[15,20,24,28,31,34],kind:"General waste"},
{id:"BIN-022",area:"Yelahanka New Town",fill:23,lat:13.1007,lng:77.5963,updated:"12:01 PM",trend:[12,14,16,19,21,23],kind:"General waste"},
{id:"BIN-045",area:"Banashankari 2nd Stage",fill:61,lat:12.9255,lng:77.5631,updated:"11:40 AM",trend:[27,33,41,49,55,61],kind:"Organic waste"}
];
let reports=[{id:"RPT-4502",bin:"BIN-028",issue:"Overflowing bin",area:"Koramangala (Main Rd)",time:"12:20 PM",status:"Open",description:"Waste is spilling onto the footpath."},{id:"RPT-4498",bin:"BIN-017",issue:"Overflowing bin",area:"Indiranagar (6th Cross)",time:"11:50 AM",status:"In progress",description:"Bin is nearly full."},{id:"RPT-4491",bin:"BIN-009",issue:"Damaged lid",area:"HSR Layout Sector 2",time:"10:35 AM",status:"Resolved",description:"Lid was loose; maintenance requested."}];
let currentPage="dashboard", selectedFilter="all", routeGenerated=false;
const $=id=>document.getElementById(id);
function status(fill){return fill>80?"critical":fill>=60?"warning":"normal"}
function statusLabel(s){return s==="critical"?"Critical":s==="warning"?"Warning":"Normal"}
function fmtStatus(fill){let s=status(fill);return `<span class="status ${s}">${s==="critical"?"●":s==="warning"?"●":"●"} ${statusLabel(s)}</span>`}
function pageHead(title,desc,actions=""){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function btn(label,fn,kind="btn-light"){return `<button class="btn ${kind}" onclick="${fn}">${label}</button>`}
function stat(label,value,icon,color,delta){return `<div class="stat"><div class="stat-icon" style="background:${color}">${icon}</div><div><small>${label}</small><strong>${value}</strong><div class="delta">${delta||"Updated just now"}</div></div></div>`}
function filteredBins(){return bins.filter(b=>selectedFilter==="all"||status(b.fill)===selectedFilter)}
function binRows(list){return list.map(b=>`<tr><td><span class="binid">${b.id}</span></td><td>${b.area}</td><td><span class="fillbar"><i style="width:${b.fill}%;background:${b.fill>80?'var(--red)':b.fill>=60?'var(--yellow)':'var(--green)'}"></i></span>${b.fill}%</td><td>${fmtStatus(b.fill)}</td><td>${b.updated}</td><td><button class="mini-btn" onclick="showBin('${b.id}')">View details ↗</button></td></tr>`).join("")}
function tablePanel(list,limit){return `<div class="panel"><div class="panel-head"><h3>Bin status overview</h3><span class="sub">${list.length} bins shown</span></div><div class="table-wrap"><table><thead><tr><th>Bin ID</th><th>Location</th><th>Fill level</th><th>Status</th><th>Last update</th><th></th></tr></thead><tbody>${binRows(limit?list.slice(0,limit):list)}</tbody></table></div></div>`}
function lineChart(){let vals=[42,48,44,58,58,67,67],days=["Oct 1","Oct 2","Oct 3","Oct 4","Oct 5","Oct 6","Oct 7"];let pts=vals.map((v,i)=>`${45+i*65},${168-v*1.45}`).join(" ");return `<div class="chart"><svg viewBox="0 0 470 205" role="img" aria-label="Fill level trend chart"><g stroke="#e8eef3" stroke-width="1">${[35,70,105,140,175].map(y=>`<line x1="38" y1="${y}" x2="455" y2="${y}"/>`).join("")}${[45,110,175,240,305,370,435].map(x=>`<line x1="${x}" y1="25" x2="${x}" y2="175"/>`).join("")}</g><g fill="#8392a2" font-size="10"><text x="4" y="38">100%</text><text x="10" y="73">75%</text><text x="10" y="108">50%</text><text x="10" y="143">25%</text><text x="22" y="178">0%</text>${days.map((d,i)=>`<text x="${45+i*65}" y="197" text-anchor="middle">${d}</text>`).join("")}</g><polyline points="${pts}" fill="none" stroke="#1685f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${45+i*65}" cy="${168-v*1.45}" r="4" fill="#1685f8"/>`).join("")}</svg></div>`}
function donut(){let n=bins.filter(b=>status(b.fill)==="normal").length,w=bins.filter(b=>status(b.fill)==="warning").length,c=bins.filter(b=>status(b.fill)==="critical").length;return `<div class="donut-wrap"><div class="donut"><div class="donut-center"><strong>${bins.length}</strong><span>Total bins</span></div></div><div class="legend-list"><div><span class="dot" style="background:var(--green)"></span>Normal <b>${n} bins · ${Math.round(n/bins.length*100)}%</b></div><div><span class="dot" style="background:var(--yellow)"></span>Warning <b>${w} bins · ${Math.round(w/bins.length*100)}%</b></div><div><span class="dot" style="background:var(--red)"></span>Critical <b>${c} bins · ${Math.round(c/bins.length*100)}%</b></div></div></div>`}
function mapMarkup(){let pos=[[26,22],[47,18],[70,27],[19,48],[39,43],[61,48],[80,58],[31,69],[51,76],[70,78],[13,80],[87,31]];return `<div class="mapbox" id="mapbox">${bins.map((b,i)=>`<button class="pin ${status(b.fill)}" style="left:${pos[i][0]}%;top:${pos[i][1]}%" title="${b.id} · ${b.fill}% full" onclick="showBin('${b.id}')"><span>${b.fill>80?"!":"•"}</span></button>`).join("")}<span class="map-label" style="left:24%;top:31%">RAJAJINAGAR</span><span class="map-label" style="left:57%;top:37%">INDIRANAGAR</span><span class="map-label" style="left:37%;top:57%">JAYANAGAR</span><span class="map-label" style="left:65%;top:68%">BTM LAYOUT</span><span class="map-label" style="left:73%;top:88%">BENGALURU</span><div class="map-legend"><strong>Bin status</strong><span><i class="dot" style="background:var(--green)"></i>Normal · 0–59%</span><span><i class="dot" style="background:var(--yellow)"></i>Warning · 60–80%</span><span><i class="dot" style="background:var(--red)"></i>Critical · above 80%</span></div></div>`}
function renderDashboard(){let n=bins.filter(b=>status(b.fill)==="normal").length,w=bins.filter(b=>status(b.fill)==="warning").length,c=bins.filter(b=>status(b.fill)==="critical").length;return `${pageHead("Good morning, Supervisor 👋","Here’s what’s happening with the smart bins today.",btn("＋ Add bin","toastMsg('Add-bin flow is a demo feature')","btn-primary"))}<div class="stats">${stat("Total bins",bins.length,"♻","#dff7ed","+2 added this month")}${stat("Normal",n,"✓","#dff7ed",`${Math.round(n/bins.length*100)}% of total`)}${stat("Warning",w,"⚠","#fff2cf",`${Math.round(w/bins.length*100)}% of total`)}${stat("Critical",c,"!","#ffebeb",`${Math.round(c/bins.length*100)}% need attention`)}</div><div class="grid2"><div class="panel"><div class="panel-head"><h3>Average fill-level trend</h3><span class="sub">Last 7 days</span></div>${lineChart()}</div><div class="panel"><div class="panel-head"><h3>Bin status distribution</h3><span class="sub">Live overview</span></div>${donut()}</div></div><div class="grid2"><div class="panel"><div class="panel-head"><h3>Bins needing attention</h3><button class="mini-btn" onclick="go('alerts')">View all →</button></div><div class="alert-list">${bins.filter(b=>b.fill>80).slice(0,4).map(b=>`<div class="alert-item"><div class="alert-symbol">!</div><div class="alert-copy"><strong>${b.id} · ${b.fill}% full</strong><p>${b.area}</p></div>${fmtStatus(b.fill)}<button class="mini-btn" onclick="showBin('${b.id}')">View</button></div>`).join("")}</div></div><div class="panel"><div class="panel-head"><h3>Collection activity</h3><span class="sub">Today</span></div><div style="display:grid;gap:15px;padding:8px 0"><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><span>Bins monitored</span><b>${bins.length}/${bins.length}</b></div><div class="fillbar" style="width:100%;height:8px"><i style="width:100%;background:var(--green)"></i></div></div><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><span>Priority bins identified</span><b>${c} bins</b></div><div class="fillbar" style="width:100%;height:8px"><i style="width:${c/bins.length*100}%;background:var(--red)"></i></div></div><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><span>Citizen reports</span><b>${reports.length}</b></div><div class="fillbar" style="width:100%;height:8px"><i style="width:${Math.min(100,reports.length*20)}%;background:#1685f8"></i></div></div></div>${btn("Plan collection route →","go('routes')","btn-primary")}</div></div>${tablePanel(bins,5)}`}
function renderMap(){return `${pageHead("Live bin map","Explore monitored bins across Bengaluru. Select a marker to inspect its details.",btn("↻ Refresh readings","toastMsg('Sensor readings refreshed (simulated)')"))}<div class="map-toolbar"><input class="input" id="mapSearch" placeholder="Search bin ID or location…" oninput="filterMapPins()"><select class="select" id="mapFilter" onchange="filterMapPins()"><option value="all">All statuses</option><option value="critical">Critical</option><option value="warning">Warning</option><option value="normal">Normal</option></select><span class="sub" style="align-self:center">12 sample bins · Bengaluru</span></div>${mapMarkup()}<div style="height:16px"></div>${tablePanel(bins)}</div>`}
function renderAlerts(){let critical=bins.filter(b=>b.fill>80),warning=bins.filter(b=>b.fill>=60&&b.fill<=80);return `${pageHead("Alerts & notifications","Prioritise bins that need collection or maintenance.",btn("✓ Mark all reviewed","toastMsg('All visible alerts marked as reviewed')"))}<div class="stats">${stat("Critical alerts",critical.length,"!","#ffebeb","Immediate collection recommended")}${stat("Warning alerts",warning.length,"⚠","#fff2cf","Monitor fill levels")}${stat("Open citizen reports",reports.filter(r=>r.status!=="Resolved").length,"▤","#e6f1ff","Awaiting action")}${stat("Resolved reports",reports.filter(r=>r.status==="Resolved").length,"✓","#dff7ed","Completed")}</div><div class="panel"><div class="panel-head"><h3>Active bin alerts</h3><span class="sub">Threshold: above 80%</span></div><div class="map-toolbar"><select class="select" id="alertFilter" onchange="filterAlerts()"><option value="all">All alerts</option><option value="critical">Critical only</option><option value="warning">Warnings only</option></select><input class="input" id="alertSearch" placeholder="Search alerts…" oninput="filterAlerts()"></div><div class="alert-list" id="alertList">${[...critical,...warning].sort((a,b)=>b.fill-a.fill).map(b=>`<div class="alert-item" data-status="${status(b.fill)}" data-search="${(b.id+b.area).toLowerCase()}"><div class="alert-symbol" style="${status(b.fill)==='warning'?'background:#fff5d9;color:#a87500':''}">${status(b.fill)==='critical'?'!':'⚠'}</div><div class="alert-copy"><strong>${b.id} · ${b.fill}% full</strong><p>${b.area} · Last sensor update ${b.updated}</p></div><span class="alert-time">${b.fill>90?'Urgent':'Today'}</span><button class="mini-btn" onclick="showBin('${b.id}')">View details</button><button class="mini-btn" onclick="resolveBin('${b.id}')">✓ Reviewed</button></div>`).join("")}</div></div>`}
function renderAnalytics(){let areaCounts={};bins.filter(b=>b.fill>80).forEach(b=>{let area=b.area.split(" ")[0];areaCounts[area]=(areaCounts[area]||0)+1});let max=Math.max(...bins.map(b=>b.fill));return `${pageHead("Waste analytics","Use sensor history to identify patterns and improve collection planning.",`<select class="select" onchange="toastMsg('Showing '+this.value+' of simulated data')"><option>Last 7 days</option><option>Last 30 days</option><option>Last 3 months</option></select>`)}<div class="stats">${stat("Average fill level",Math.round(bins.reduce((a,b)=>a+b.fill,0)/bins.length)+"%","◷","#e6f1ff","Across all monitored bins")}${stat("Critical bins",bins.filter(b=>b.fill>80).length,"!","#ffebeb","Require collection")}${stat("Reports this week",reports.length,"▤","#e7f8f0","Citizen-submitted")}${stat("Prediction horizon","6 hrs","⌁","#fff2cf","Illustrative forecast")}</div><div class="grid-even"><div class="panel"><div class="panel-head"><h3>Fill level over time</h3><span class="sub">Illustrative sensor history</span></div>${lineChart()}<div class="legend"><span><i class="dot" style="background:#1685f8"></i>Average fill (%)</span></div></div><div class="panel"><div class="panel-head"><h3>Current fill by bin</h3><span class="sub">Highest first</span></div><div style="display:grid;gap:16px">${[...bins].sort((a,b)=>b.fill-a.fill).slice(0,7).map(b=>`<div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px"><span>${b.id} · ${b.area.split("(")[0]}</span><b>${b.fill}%</b></div><div style="height:7px;border-radius:9px;background:#eef2f5;overflow:hidden"><div style="width:${b.fill}%;height:100%;background:${b.fill>80?'var(--red)':b.fill>=60?'var(--yellow)':'var(--green)'};border-radius:9px"></div></div></div>`).join("")}</div></div></div><div class="grid-even"><div class="panel"><div class="panel-head"><h3>Overflow-prone locations</h3><span class="sub">Priority review</span></div>${bins.filter(b=>b.fill>80).map((b,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f5"><span style="background:#fff0f0;color:#c33;border-radius:8px;padding:8px;font-size:11px;font-weight:800">${i+1}</span><div style="flex:1;font-size:12px"><b>${b.area}</b><div class="sub" style="margin-top:4px">${b.id}</div></div><b style="color:var(--red)">${b.fill}%</b></div>`).join("")}</div><div class="panel"><div class="panel-head"><h3>Fill-time forecast</h3><span class="sub">Demo estimates</span></div>${bins.filter(b=>b.fill>=60).sort((a,b)=>b.fill-a.fill).slice(0,6).map(b=>{let mins=Math.max(20,Math.round((100-b.fill)*7));return `<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1f5;font-size:12px"><span><b>${b.id}</b><div class="sub" style="margin-top:4px">${b.area}</div></span><span style="font-weight:700;color:${b.fill>80?'var(--red)':'#a87500'}">${Math.floor(mins/60)}h ${mins%60}m</span></div>`}).join("")}<p class="sub" style="margin-top:13px">Predictions are illustrative estimates, not trained ML outputs.</p></div></div>`}
function renderRoutes(){let critical=[...bins].filter(b=>b.fill>80).sort((a,b)=>b.fill-a.fill);return `${pageHead("Collection route planning","Build a priority route for bins that are critical or nearing capacity.",btn("↻ Reset route","routeGenerated=false;go('routes')"))}<div class="stats">${stat("Priority stops",critical.length,"⌖","#ffebeb","Above 80% full")}${stat("Vehicles available",3,"🚚","#e6f1ff","Demo fleet")}${stat("Estimated distance",routeGenerated?"18.6 km":"—","↗","#dff7ed","Illustrative route")}${stat("Estimated duration",routeGenerated?"1h 16m":"—","◷","#fff2cf","Excluding traffic delays")}</div><div class="route-layout"><div class="panel"><div class="panel-head"><h3>Today's collection route</h3><span class="status critical">${critical.length} priority</span></div><div class="route-card"><div class="route-card-head"><span>🚚 Vehicle 01 · North & Central</span><span style="color:var(--green)">Active</span></div><div class="route-meta">${routeGenerated?'Route generated just now':'Ready to plan'} · Driver: Demo Driver</div><div class="stops">${(routeGenerated?critical:critical.slice(0,4)).map((b,i)=>`<div class="stop"><b>${b.id} · ${b.fill}% full</b><span>${b.area}</span></div>`).join("")}</div></div><div class="route-card"><div class="route-card-head"><span>🚚 Vehicle 02 · South & East</span><span style="color:#a87500">Standby</span></div><div class="route-meta">Suggested for remaining warning bins</div></div><button class="btn btn-primary" style="width:100%;justify-content:center" onclick="generateRoute()">✦ Generate optimized route</button><p class="sub" style="line-height:1.6;margin-top:13px">Demo mode: route order is prioritised by fill level. Real road-distance optimisation requires a routing service and road-network data.</p></div><div class="panel"><div class="panel-head"><h3>Route map</h3><span class="sub">Bengaluru · illustrative</span></div>${mapMarkup()}<div style="display:flex;gap:15px;flex-wrap:wrap;margin-top:12px" class="legend"><span><i class="dot" style="background:var(--red)"></i>Priority stop</span><span><i class="dot" style="background:var(--yellow)"></i>Monitor</span><span><i class="dot" style="background:var(--green)"></i>Normal</span></div></div></div>`}
function renderReports(){return `${pageHead("Citizen reports","Review public reports and submit a new issue using this demo form.",btn("＋ New report","$('reportForm').scrollIntoView({behavior:'smooth'})","btn-primary"))}<div class="report-layout"><div class="panel"><div class="panel-head"><h3>Report a bin issue</h3><span class="sub">Citizen portal · Demo</span></div><form id="reportForm" onsubmit="submitReport(event)"><div class="form-grid"><div class="field"><label>Bin ID or location *</label><input class="input" id="reportBin" placeholder="e.g. BIN-028 or Koramangala" required></div><div class="field"><label>Issue type *</label><select class="select" id="reportType"><option>Overflowing bin</option><option>Damaged bin</option><option>Missed collection</option><option>Illegal dumping</option></select></div><div class="field full"><label>Description</label><textarea class="textarea" id="reportDesc" placeholder="Tell us what you noticed…"></textarea></div><div class="field full"><label>Add photo (optional)</label><div class="upload">▧<br>Attach a photo to this report<input id="reportPhoto" type="file" accept="image/*"></div></div><div class="field"><label>Contact (optional)</label><input class="input" id="reportContact" placeholder="Email or phone"></div><div class="field" style="align-self:end"><button class="btn btn-primary" type="submit" style="justify-content:center">Submit report →</button></div></div></form><div class="success-box" id="reportSuccess"><strong>✓ Report submitted successfully</strong><span id="reportSuccessText"></span></div></div><div class="panel"><div class="panel-head"><h3>Recent citizen reports</h3><span class="sub" id="reportCount">${reports.length} reports</span></div><div id="reportList">${reportCards()}</div></div></div>`}
function reportCards(){return reports.map(r=>`<div class="route-card"><div class="route-card-head"><span>${r.issue}</span><span class="status ${r.status==='Resolved'?'normal':r.status==='In progress'?'warning':'critical'}">${r.status}</span></div><div class="route-meta">${r.id} · ${r.time}</div><div style="font-size:12px;font-weight:650">${r.bin} · ${r.area}</div><p class="sub" style="line-height:1.5">${r.description||"No extra details provided."}</p>${r.status!=="Resolved"?`<button class="mini-btn" onclick="resolveReport('${r.id}')">Mark resolved ✓</button>`:""}</div>`).join("")}
function renderSettings(){return `${pageHead("Settings","Configure prototype thresholds and dashboard preferences.")}<div class="grid-even"><div class="panel"><div class="panel-head"><h3>Alert thresholds</h3><span class="sub">Demo configuration</span></div><div class="field" style="margin-bottom:15px"><label>Warning threshold (%)</label><input class="input" value="60" type="number" min="1" max="100" id="warningThreshold"></div><div class="field" style="margin-bottom:15px"><label>Critical threshold (%)</label><input class="input" value="80" type="number" min="1" max="100" id="criticalThreshold"></div><button class="btn btn-primary" onclick="toastMsg('Threshold settings saved for this demo session')">Save settings</button></div><div class="panel"><div class="panel-head"><h3>System configuration</h3><span class="status normal">Demo mode</span></div><div class="detail-grid"><div class="detail-stat"><small>Data source</small><strong>Simulated readings</strong></div><div class="detail-stat"><small>Refresh interval</small><strong>15 minutes</strong></div><div class="detail-stat"><small>Sensor connection</small><strong>Not connected</strong></div><div class="detail-stat"><small>Database</small><strong>Local sample data</strong></div></div><p class="sub" style="line-height:1.7;margin-top:16px">This prototype runs entirely in your browser. Sensor connectivity, SMS delivery, persistent storage, and real road routing are not enabled.</p></div></div>`}
const renderers={dashboard:renderDashboard,map:renderMap,alerts:renderAlerts,analytics:renderAnalytics,routes:renderRoutes,reports:renderReports,settings:renderSettings};
const labels={dashboard:"Dashboard",map:"Live Map",alerts:"Alerts",analytics:"Analytics",routes:"Route Planning",reports:"Citizen Reports",settings:"Settings"};
function go(page){currentPage=page;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("crumb").textContent="Municipal Operations / "+labels[page];$("content").innerHTML=renderers[page]();window.scrollTo({top:0,behavior:"smooth"});$("bellCount").textContent=bins.filter(b=>b.fill>80).length}
function toastMsg(msg){$("toast").textContent=msg;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function showBin(id){let b=bins.find(x=>x.id===id);if(!b)return;$("modalTitle").textContent="Bin details · "+b.id;$("modalBody").innerHTML=`<p class="sub" style="margin-top:0">${b.area}</p><div class="detail-grid"><div class="detail-stat"><small>Current fill level</small><strong style="color:${b.fill>80?'var(--red)':b.fill>=60?'#a87500':'var(--green)'}">${b.fill}%</strong><div style="height:6px;background:#e9eef2;border-radius:5px;margin-top:9px"><div style="height:100%;width:${b.fill}%;background:${b.fill>80?'var(--red)':b.fill>=60?'var(--yellow)':'var(--green)'};border-radius:5px"></div></div></div><div class="detail-stat"><small>Status</small><strong>${statusLabel(status(b.fill))}</strong><div style="margin-top:8px">${fmtStatus(b.fill)}</div></div><div class="detail-stat"><small>Bin type</small><strong>${b.kind}</strong></div><div class="detail-stat"><small>Last sensor update</small><strong>${b.updated}</strong></div><div class="detail-stat"><small>GPS latitude</small><strong>${b.lat}</strong></div><div class="detail-stat"><small>GPS longitude</small><strong>${b.lng}</strong></div></div><div style="margin-top:16px"><h3 style="font-size:13px">Recent fill readings</h3><div style="display:flex;gap:8px;align-items:end;height:80px;margin-top:12px">${b.trend.map((v,i)=>`<div style="flex:1;text-align:center"><div title="${v}%" style="height:${v*.65}px;background:${v>80?'var(--red)':v>=60?'var(--yellow)':'var(--green)'};border-radius:5px 5px 0 0"></div><small style="font-size:9px;color:#7b8a9a">${i+1}</small></div>`).join("")}</div></div><div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap"><button class="btn btn-primary" onclick="closeModal();go('routes')">Plan collection</button><button class="btn btn-light" onclick="closeModal();go('alerts')">View alerts</button></div>`;$("modalBack").style.display="flex"}
function closeModal(){$("modalBack").style.display="none"}
function resolveBin(id){let b=bins.find(x=>x.id===id);if(b){b.fill=58;b.updated="Just now";toastMsg(id+" marked reviewed; fill simulated at 58%");go(currentPage)}}
function filterAlerts(){let f=$("alertFilter").value,q=$("alertSearch").value.toLowerCase();document.querySelectorAll("#alertList .alert-item").forEach(el=>el.style.display=((f==="all"||el.dataset.status===f)&&el.dataset.search.includes(q))?"flex":"none")}
function filterMapPins(){let q=$("mapSearch").value.toLowerCase(),f=$("mapFilter").value;document.querySelectorAll(".pin").forEach((p,i)=>{let b=bins[i];p.style.display=((!q||(b.id+b.area).toLowerCase().includes(q))&&(f==="all"||status(b.fill)===f))?"grid":"none"})}
function generateRoute(){routeGenerated=true;go("routes");toastMsg("Priority route generated using simulated bin data")}
function submitReport(e){e.preventDefault();let location=$("reportBin").value.trim();let found=bins.find(b=>b.id.toLowerCase()===location.toLowerCase());let id="RPT-"+Math.floor(4503+Math.random()*500);reports.unshift({id,bin:found?found.id:"Location pending",issue:$("reportType").value,area:found?found.area:location,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),status:"Open",description:$("reportDesc").value||"Citizen-submitted report."});$("reportSuccessText").textContent="Reference ID: "+id+". The sanitation team can now review the report in this demo."; $("reportSuccess").style.display="block";$("reportCount").textContent=reports.length+" reports";$("reportList").innerHTML=reportCards();$("reportForm").reset();toastMsg("Citizen report submitted")}
function resolveReport(id){let r=reports.find(x=>x.id===id);if(r)r.status="Resolved";go("reports");toastMsg(id+" marked resolved")}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
go("dashboard");
</script>
</body></html>
